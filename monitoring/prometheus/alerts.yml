# Thresholds are starting points, not tuned values. Validate with: make check-monitoring
# NOTE: these rules have NOT been exercised against firing conditions.
groups:
  - name: safeloop
    rules:
      - alert: SafeLoopProviderFailuresSustained
        expr: >
          sum(rate(safeloop_model_errors_total[10m]))
          / clamp_min(sum(rate(safeloop_generation_requests_total[10m])), 1e-9) > 0.5
          and sum(rate(safeloop_generation_requests_total[10m])) > 0
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "More than 50% of model calls failing for 10m"}
      - alert: SafeLoopSandboxFailureRateHigh
        expr: >
          sum(rate(safeloop_sandbox_failures_total[10m]))
          / clamp_min(sum(rate(safeloop_verification_runs_total[10m])), 1e-9) > 0.2
          and sum(rate(safeloop_verification_runs_total[10m])) > 0
        for: 10m
        labels: {severity: critical}
        annotations: {summary: "Sandbox failures exceed 20% of verification runs"}
      - alert: SafeLoopQueueSaturated
        expr: safeloop_queue_depth > 10
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Task queue depth above 10 for 5m (threshold configurable)"}
      - alert: SafeLoopTaskLatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(safeloop_task_duration_seconds_bucket[15m]))) > 300
        for: 15m
        labels: {severity: warning}
        annotations: {summary: "p95 task duration above 300s"}
      - alert: SafeLoopTargetDown
        expr: up{job="safeloop-api"} == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "Prometheus cannot scrape the Safe-Loop API"}
