[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safeloop"
version = "0.1.0"
description = "Safe-Loop: LLM code generation with deterministic verification, isolated execution and bounded repair"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "langgraph>=1.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "prometheus-client>=0.20",
  "sqlalchemy>=2.0",
  "typer>=0.12",
  "httpx>=0.27",
]

[project.scripts]
safeloop = "safeloop.cli.main:app"

[project.optional-dependencies]
docker = ["docker>=7.0"]
ui = ["streamlit>=1.35", "plotly>=5.20"]
llm = ["litellm"]
otel = ["opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp-proto-http>=1.25"]
dev = ["pytest>=8", "pytest-cov", "httpx", "ruff", "mypy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: requires a running Docker daemon"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.ruff.lint]
ignore = ["B008"]  # FastAPI Depends / Typer Option idiom

[tool.ruff.lint.per-file-ignores]
# Fail-closed adapter: broad excepts are deliberate and convert every daemon error into
# SandboxUnavailable / SandboxExecutionError.
"src/safeloop/sandbox/docker_runner.py" = ["BLE001", "S110"]
"src/safeloop/application/task_manager.py" = ["BLE001"]  # a crashed worker must still record a terminal state
"src/safeloop/persistence/repositories.py" = ["BLE001"]   # ping() reports any failure as unhealthy
"tests/**" = ["BLE001", "RUF012", "PLW1510"]
